taskId: task_itsdangerous_base64_non_ascii
title: Reject non-ASCII input in base64_decode
intent: base64_decode must reject non-ASCII input instead of silently dropping characters.
requirements:
  - requirementId: req_reject_non_ascii
    text: base64_decode raises BadData when the input contains non-ASCII characters.
    source: brownfield-demo
acceptanceCriteria:
  - criterionId: ac_non_ascii
    text: Decoding a string with a non-ASCII character raises BadData.
  - criterionId: ac_existing
    text: All existing tests keep passing.
constraints:
  - Keep the public signature of base64_decode.
implementation:
  mode: patch
  patches:
    - path: src/itsdangerous/encoding.py
      operation: replace
      content: |
        from __future__ import annotations

        import base64
        import string
        import struct
        import typing as t

        from .exc import BadData


        def want_bytes(
            s: str | bytes, encoding: str = "utf-8", errors: str = "strict"
        ) -> bytes:
            if isinstance(s, str):
                s = s.encode(encoding, errors)

            return s


        def base64_encode(string: str | bytes) -> bytes:
            """Base64 encode a string of bytes or text. The resulting bytes are
            safe to use in URLs.
            """
            string = want_bytes(string)
            return base64.urlsafe_b64encode(string).rstrip(b"=")


        def base64_decode(string: str | bytes) -> bytes:
            """Base64 decode a URL-safe string of bytes or text. The result is
            bytes.
            """
            try:
                string = want_bytes(string, encoding="ascii")
            except UnicodeEncodeError as e:
                raise BadData("Invalid base64-encoded data") from e

            string += b"=" * (-len(string) % 4)

            try:
                return base64.urlsafe_b64decode(string)
            except (TypeError, ValueError) as e:
                raise BadData("Invalid base64-encoded data") from e


        # The alphabet used by base64.urlsafe_*
        _base64_alphabet = f"{string.ascii_letters}{string.digits}-_=".encode("ascii")

        _int64_struct = struct.Struct(">Q")
        _int_to_bytes = _int64_struct.pack
        _bytes_to_int = t.cast("t.Callable[[bytes], tuple[int]]", _int64_struct.unpack)


        def int_to_bytes(num: int) -> bytes:
            return _int_to_bytes(num).lstrip(b"\x00")


        def bytes_to_int(bytestr: bytes) -> int:
            return _bytes_to_int(bytestr.rjust(8, b"\x00"))[0]
    - path: tests/test_itsdangerous/test_encoding.py
      operation: append
      content: |


        def test_base64_decode_rejects_non_ascii():
            with pytest.raises(BadData):
                base64_decode("abc\u00e9def")
