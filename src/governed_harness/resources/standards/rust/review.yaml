# Review metadata of the rust pack (#57): the review domain of a card (default
# quality), the cards that block, the signals that activate reviewers (regular expressions
# over changed lines of the pack's files) and the files the pipeline reviewer reads.
pack: rust
domains:
  rust.no-unwrap: resilience
  rust.no-unsafe: pipeline-security
  rust.traits-over-inheritance: architecture
blocking:
- rust.no-unsafe
signals:
  concurrency:
  - \bArc<
  - \bMutex<
  - \bRwLock<
  - \bthread::spawn\b
  - \btokio::spawn\b
  - \bAtomic[A-Z]\w*\b
  - '\bmpsc::'
  external-calls:
  - '\breqwest::'
  - '\bTcpStream::'
  - \bCommand::new\(
  - '\bsqlx::'
  structure:
  - ^\s*(?:pub\s+)?use\s
  - ^\s*pub\s
  - ^\s*(?:mod|trait|impl)\b
pipeline:
- build.rs
