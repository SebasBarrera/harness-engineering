# Review metadata of the vue pack (#57): the review domain of a card (default
# quality), the cards that block, the signals that activate reviewers (regular expressions
# over changed lines of the pack's files) and the files the pipeline reviewer reads.
pack: vue
domains:
  vue.composables: architecture
  vue.no-v-html: pipeline-security
blocking:
- vue.no-v-html
signals:
  concurrency: []
  external-calls:
  - \bfetch\(
  - \baxios\b
  structure:
  - ^\s*(?:import|export)\b
  - ^\s*(?:export\s+)?(?:default\s+)?(?:class|interface|type|function)\s+\w
  - \bdefine(?:Props|Emits|Component)\(
pipeline: []
