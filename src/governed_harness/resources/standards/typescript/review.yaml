# Review metadata of the typescript pack (#57): the review domain of a card (default
# quality), the cards that block, the signals that activate reviewers (regular expressions
# over changed lines of the pack's files) and the files the pipeline reviewer reads.
pack: typescript
domains:
  typescript.floating-promises: resilience
blocking: []
signals:
  concurrency:
  - \bnew Worker\(
  - \bSharedArrayBuffer\b
  - \bAtomics\.
  - \bworker_threads\b
  external-calls:
  - \bfetch\(
  - \baxios\b
  - \bhttps?\.request\(
  - \bXMLHttpRequest\b
  - \bchild_process\b
  structure:
  - ^\s*(?:import|export)\b
  - ^\s*(?:export\s+)?(?:default\s+)?(?:class|interface|type|function)\s+\w
pipeline: []
