# Review metadata of the go pack (#57): the review domain of a card (default
# quality), the cards that block, the signals that activate reviewers (regular expressions
# over changed lines of the pack's files) and the files the pipeline reviewer reads.
pack: go
domains:
  go.check-errors: resilience
  go.context: resilience
  go.race-free: concurrency
  go.small-interfaces: architecture
blocking:
- go.check-errors
- go.race-free
signals:
  concurrency:
  - \bgo\s+func\b
  - \bgo\s+\w+\(
  - \bsync\.(Mutex|RWMutex|WaitGroup|Once)\b
  - \bchan\b
  - \batomic\.
  external-calls:
  - \bhttp\.(Get|Post|Do|NewRequest)
  - \bsql\.Open\(
  - \bexec\.Command\(
  - \bnet\.Dial\(
  structure:
  - ^\s*import\b
  - ^\s*\"[\w./-]+\"\s*$
  - ^\s*func\s+(?:\([^)]*\)\s*)?[A-Z]
  - ^\s*type\s+[A-Z]
pipeline:
- .goreleaser.yml
- .goreleaser.yaml
