[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-agent-harness"
version = "1.0.0"
description = "Technology-neutral research prototype for governing AI-assisted software development"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Juan Sebastián Barrera Pulido"}]
keywords = ["ai-agents", "software-engineering", "human-in-the-loop", "governance", "harness"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  "httpx>=0.27,<1",
  "build>=1.2,<2",
  "types-PyYAML>=6",
  "types-jsonschema>=4.23",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
all = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
harness = "governed_harness.cli.main:main"
harness-plugin-echo = "governed_harness.plugins.sdk:main"

[project.urls]
Homepage = "https://github.com/SebasBarrera/harness-engineering"
Documentation = "https://sebasbarrera.github.io/harness-engineering/"
Repository = "https://github.com/SebasBarrera/harness-engineering"
Issues = "https://github.com/SebasBarrera/harness-engineering/issues"
Changelog = "https://github.com/SebasBarrera/harness-engineering/blob/develop/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["governed_harness*"]

[tool.setuptools.package-data]
governed_harness = [
  "py.typed",
  "resources/profiles/*.yaml",
  "resources/workflows/*.yaml",
  "resources/verification/*.yaml",
  "resources/schemas/v1/*.json",
  "resources/standards/*/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration", "tests/security", "tests/e2e", "tests/performance"]
addopts = "-q --strict-markers"
markers = [
  "e2e: end-to-end execution tests",
  "performance: benchmark smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/typer.Argument in defaults is the documented Typer idiom.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["governed_harness"]

[tool.coverage.run]
source = ["governed_harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
