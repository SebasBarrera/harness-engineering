# Gitleaks configuration: the default rules plus documented exceptions.
title = "harness-engineering"

[extend]
useDefault = true

[[allowlists]]
description = "Fictitious password set by a hidden test of the controlled evaluation; it is not a credential."
regexes = ['''s3cret-from-env''']

[[allowlists]]
description = "Fictitious credential once used by the native-adapter redaction test (commit 5b6b918, since replaced); it is not a credential."
regexes = ['''sk-test-0123456789abcdef''']

[[allowlists]]
description = "Fictitious sample values of the context-aware secret check's unit tests in an earlier commit of the wave 2 branch; they are not credentials and were replaced by plain words."
regexes = ['''k-91827364-live''', '''^abcdef123456$''']

[[allowlists]]
description = "Workspace lease tokens recorded by the deterministic fault probes of the 2.0.0 evaluation: random identifiers of a local lock held by a run, not credentials."
condition = "AND"
paths = ['''^evaluation/results-2\.0\.0/deterministic/fault-probes/''']
regexTarget = "line"
regexes = ['''"leaseHeld": true''']

[[allowlists]]
description = "Fictitious JWT of the H03 secrets corpus of the 2.0.0 evaluation (evaluation/deterministic/h03_secrets.py, first committed in f92582d): a seeded value the harness must detect, not a credential; the file now builds it from two parts."
regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiJhbGVydHMifQ\.c2lnbmF0dXJlLXZhbHVlLTIwMjY''']
