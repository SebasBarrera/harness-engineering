    import pytest

    from inventory import Inventory


    def make():
        inv = Inventory()
        inv.add_item("ABC-0001", "Bolt", "1.50", 10)
        inv.add_item("XYZ-0002", "Nut", "0.25", 4)
        return inv


    def test_ac_c_roundtrip_preserves_items_prices_and_history(tmp_path):
        inv = make()
        inv.receive("ABC-0001", 2)
        path = tmp_path / "inv.json"
        inv.save(path)
        loaded = Inventory.load(path)
        assert loaded.list_items() == inv.list_items()
        assert loaded.history("ABC-0001") == [("receive", 2)]


    @pytest.mark.parametrize("name", ["inv.txt", "inv.json.bak", "inv"])
    def test_ac_c_extension_rejects_other_suffixes(tmp_path, name):
        path = tmp_path / name
        path.write_text("{}")
        for value in (path, str(path)):
            with pytest.raises(ValueError):
                Inventory.load(value)


    @pytest.mark.parametrize(
        "content",
        [
            "{not json",
            '{"items": [{"sku": "bad", "name": "x", "price": "1", "quantity": 1}]}',
            '{"items": [{"sku": "ABC-0001", "name": "x", "price": "1", "quantity": -3}]}',
            '{"items": [{"sku": "ABC-0001", "name": "x", "price": "-1", "quantity": 3}]}',
        ],
    )
    def test_ac_c_invalid_rejects_bad_content(tmp_path, content):
        path = tmp_path / "inv.json"
        path.write_text(content)
        with pytest.raises(ValueError):
            Inventory.load(path)


    def test_ac_c_invalid_rejects_large_files(tmp_path):
        path = tmp_path / "big.json"
        path.write_text(" " * (1024 * 1024 + 1) + "{}")
        with pytest.raises(ValueError):
            Inventory.load(path)
