  e_cli_correct: |
    """Command line: python -m inventory.cli value FILE prints the item count and the stock value."""

    import json
    import sys
    from decimal import ROUND_HALF_UP, Decimal

    from inventory import Inventory


    def main(argv=None):
        args = sys.argv[1:] if argv is None else argv
        if len(args) != 2 or args[0] != "value":
            print("usage: python -m inventory.cli value FILE", file=sys.stderr)
            return 2
        with open(args[1], encoding="utf-8") as handle:
            data = json.load(handle)
        inv = Inventory()
        for item in data["items"]:
            inv.add_item(item["sku"], item["name"], item["price"], item["quantity"])
        items = inv.list_items()
        total = sum((i["price"] * i["quantity"] for i in items), Decimal(0))
        total = total.quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)
        print(json.dumps({"items": len(items), "totalValue": str(total)}))
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
  # The value is computed in floating point from the raw prices of the file (0.335 * 3 + 2.5 * 2
  # prints 6.00), not from the prices the inventory stores rounded to cents.
  e_cli_float: |
    """Command line: python -m inventory.cli value FILE prints the item count and the stock value."""

    import json
    import sys


    def main(argv=None):
        args = sys.argv[1:] if argv is None else argv
        if len(args) != 2 or args[0] != "value":
            print("usage: python -m inventory.cli value FILE", file=sys.stderr)
            return 2
        with open(args[1], encoding="utf-8") as handle:
            data = json.load(handle)
        total = sum(float(item["price"]) * item["quantity"] for item in data["items"])
        print(json.dumps({"items": len(data["items"]), "totalValue": f"{total:.2f}"}))
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())

