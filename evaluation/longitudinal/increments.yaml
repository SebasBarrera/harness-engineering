# Five increments of the same development, in a fixed order for both conditions.
# casual: the one-line prompt of the baseline. task: the structured task of the harness condition,
# which carries the rules as requirements and acceptance criteria. SPEC.md names only the API.
# parts: SPEC parts checked by the external oracle after the increment.
# The texts the model receives are in Spanish (maintainer decision of 2026-11-11); identifiers,
# values and commands stay as they are.
- id: I1
  parts:
  - a
  casual: haz la biblioteca de inventario de SPEC.md, por ahora solo la parte A (artículos)
  task:
    title: Artículos del inventario (parte A)
    intent: Implementar la parte A (artículos) del paquete inventory, con pruebas de pytest.
    requirements:
    - 'add_item(sku, name, price, quantity=0): sku debe cumplir ^[A-Z]{3}-\d{4}$; un SKU duplicado, un nombre
      vacío, un precio negativo o una cantidad que no sea un int no negativo lanzan ValueError; price acepta int,
      str o Decimal y se guarda como Decimal redondeado half up (mitad hacia arriba) a dos decimales.'
    - get_item(sku) devuelve {sku, name, price, quantity}; remove_item(sku) lo elimina; los SKU desconocidos
      lanzan KeyError; list_items() devuelve los artículos como diccionarios ordenados por SKU.
    acceptanceCriteria:
    - Los SKU inválidos (en minúsculas, de longitud incorrecta, sin guion, vacíos), los SKU duplicados, los
      nombres vacíos, los precios negativos y las cantidades negativas o que no son int lanzan ValueError.
    - get_item devuelve el precio como Decimal con dos decimales (por ejemplo, '3.456' se convierte en 3.46); los
      SKU desconocidos lanzan KeyError en get_item y remove_item.
    - tests/ contiene pruebas de pytest para cada regla anterior y python -m pytest -q pasa.
    constraints:
    - Usar solo la biblioteca estándar de Python.
- id: I2
  parts:
  - a
  - b
  casual: ahora agrega los movimientos de stock, la parte B de la especificación
  task:
    title: Movimientos de stock (parte B)
    intent: Implementar la parte B (movimientos de stock) sin romper la parte A, con pruebas de pytest.
    requirements:
    - 'receive(sku, quantity) y ship(sku, quantity): quantity debe ser un int positivo (0, los negativos, los
      floats y los strings lanzan ValueError); despachar más que la cantidad disponible lanza ValueError y no
      cambia ni la cantidad ni el historial.'
    - history(sku) devuelve los movimientos en orden como tuplas ('receive' o 'ship', quantity); los SKU
      desconocidos lanzan KeyError.
    acceptanceCriteria:
    - receive y ship actualizan la cantidad; history lista los movimientos en orden.
    - Las cantidades inválidas y los despachos mayores que la cantidad disponible lanzan ValueError sin cambios;
      los SKU desconocidos lanzan KeyError.
    - Las pruebas cubren la parte B y todas las pruebas existentes siguen pasando.
    constraints:
    - Usar solo la biblioteca estándar de Python.
- id: I3
  parts:
  - a
  - b
  casual: agrega pruebas unitarias
  task:
    title: Pruebas unitarias de las partes A y B
    intent: Agregar o completar pruebas de pytest que cubran cada regla de las partes A y B (las reglas de las
      tareas anteriores).
    requirements:
    - Cada regla de validación y cada error de las partes A y B tiene al menos una prueba.
    acceptanceCriteria:
    - Las pruebas ejercitan entradas válidas e inválidas para add_item, get_item, remove_item, list_items, receive,
      ship y history.
    - python -m pytest -q pasa.
    constraints:
    - No cambiar el comportamiento público de la biblioteca.
- id: I4
  parts:
  - a
  - b
  - c
  casual: agrega guardar y cargar el inventario en un archivo json (parte C), que sea seguro
  task:
    title: Persistencia segura (parte C)
    intent: Implementar la parte C (persistencia) de forma segura, con pruebas de pytest.
    requirements:
    - save(path) escribe el inventario, incluido el historial, como JSON, con los precios como strings.
    - Inventory.load(path) devuelve un inventario nuevo; acepta solo rutas que terminan en .json, rechaza archivos
      de más de 1 MB y lanza ValueError ante JSON mal formado o datos inválidos (SKU incorrecto, cantidad negativa,
      precio negativo); nunca usa pickle ni eval.
    acceptanceCriteria:
    - Un ciclo de ida y vuelta save/load (round trip) conserva los artículos, los precios y el historial.
    - load lanza ValueError para una ruta que no es .json, un archivo de más de 1 MB, JSON mal formado, un SKU
      inválido, una cantidad negativa o un precio negativo.
    - Las pruebas cubren la parte C y todas las pruebas existentes siguen pasando.
    constraints:
    - Usar solo la biblioteca estándar de Python.
- id: I5
  parts:
  - a
  - b
  - c
  - d
  casual: agrega los reportes de la parte D
  task:
    title: Reportes (parte D)
    intent: Implementar la parte D (reportes), con pruebas de pytest.
    requirements:
    - low_stock(threshold) devuelve los SKU cuya cantidad es estrictamente menor que threshold, ordenados.
    - total_value() devuelve la suma de price * quantity como un Decimal redondeado una sola vez, half up (mitad
      hacia arriba), a dos decimales (0.00 para un inventario vacío).
    acceptanceCriteria:
    - low_stock usa una comparación estricta y devuelve los SKU ordenados.
    - total_value devuelve un Decimal con dos decimales, redondeado una sola vez.
    - Las pruebas cubren la parte D y todas las pruebas existentes siguen pasando.
    constraints:
    - Usar solo la biblioteca estándar de Python.
