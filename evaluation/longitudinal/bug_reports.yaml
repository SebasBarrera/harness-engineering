# Bug report sent when a hidden check fails, as a user would describe the observed problem.
# The texts are in Spanish (maintainer decision of 2026-11-11); the keys are the hidden test names.
test_a_add_and_get_item: "después de add_item('ABC-0001', 'Bolt', '1.50', 10), get_item('ABC-0001') debería devolver {'sku': 'ABC-0001', 'name': 'Bolt', 'price': Decimal('1.50'), 'quantity': 10}"
test_a_invalid_sku_rejected: "add_item acepta SKU inválidos como 'abc-0001', 'AB-0001', 'ABC-001', 'ABC0001' o ''; los SKU deben tener la forma ABC-0001 y los inválidos deben lanzar ValueError"
test_a_duplicate_and_bad_values_rejected: "add_item debe lanzar ValueError para un SKU duplicado, un nombre vacío, un precio negativo, una cantidad negativa o una cantidad que no sea entera, como 1.5"
test_a_unknown_sku_and_remove: "get_item y remove_item deben lanzar KeyError para un SKU desconocido o ya eliminado"
test_a_list_sorted_and_price_two_places: "list_items debe estar ordenado por SKU y los precios deben ser Decimal con dos decimales ('3.456' se convierte en 3.46, 2 se convierte en 2.00)"
test_b_receive_ship_and_history: "después de receive('ABC-0001', 5) y ship('ABC-0001', 12) sobre 10 unidades, la cantidad debería ser 3 y el historial debería ser [('receive', 5), ('ship', 12)]"
test_b_overship_rejected_without_change: "despachar más que el stock debe lanzar ValueError y no cambiar ni la cantidad ni el historial"
test_b_invalid_quantities: "receive y ship deben lanzar ValueError para las cantidades 0, -1, 1.5 o '2'"
test_b_unknown_sku: "receive sobre un SKU desconocido debe lanzar KeyError"
test_c_round_trip: "save seguido de Inventory.load debe restaurar los artículos, los precios y el historial, y el archivo debe ser JSON plano"
test_c_rejects_non_json_extension: "Inventory.load debe lanzar ValueError para una ruta que no termina en .json"
test_c_rejects_invalid_content: "Inventory.load debe lanzar ValueError ante JSON mal formado, un SKU inválido, una cantidad negativa o un precio negativo en el archivo"
test_c_rejects_large_files: "Inventory.load debe lanzar ValueError para archivos de más de 1 MB"
test_d_low_stock: "low_stock(threshold) debe devolver los SKU cuya cantidad es estrictamente menor que el umbral, ordenados"
test_d_total_value_rounding: "total_value debe devolver un Decimal redondeado half up (mitad hacia arriba) a dos decimales, y Decimal('0.00') para un inventario vacío"
collection: "la biblioteca no se puede usar: from inventory import Inventory falla o las pruebas ni siquiera arrancan; debe poder importarse como el paquete inventory en src/inventory"
