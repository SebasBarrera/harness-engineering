# Bug report sent when a hidden check fails, as a user would describe the observed problem.
test_a_add_and_get_item: "after add_item('ABC-0001', 'Bolt', '1.50', 10), get_item('ABC-0001') should return {'sku': 'ABC-0001', 'name': 'Bolt', 'price': Decimal('1.50'), 'quantity': 10}"
test_a_invalid_sku_rejected: "add_item accepts invalid SKUs such as 'abc-0001', 'AB-0001', 'ABC-001', 'ABC0001' or ''; SKUs must look like ABC-0001 and invalid ones must raise ValueError"
test_a_duplicate_and_bad_values_rejected: "add_item must raise ValueError for a duplicate SKU, an empty name, a negative price, a negative quantity or a non-integer quantity such as 1.5"
test_a_unknown_sku_and_remove: "get_item and remove_item must raise KeyError for an unknown or already removed SKU"
test_a_list_sorted_and_price_two_places: "list_items must be sorted by SKU and prices must be Decimal with two decimals ('3.456' becomes 3.46, 2 becomes 2.00)"
test_b_receive_ship_and_history: "after receive('ABC-0001', 5) and ship('ABC-0001', 12) on 10 units, quantity should be 3 and history should be [('receive', 5), ('ship', 12)]"
test_b_overship_rejected_without_change: "shipping more than the stock must raise ValueError and change neither the quantity nor the history"
test_b_invalid_quantities: "receive and ship must raise ValueError for quantities 0, -1, 1.5 or '2'"
test_b_unknown_sku: "receive on an unknown SKU must raise KeyError"
test_c_round_trip: "save followed by Inventory.load must restore items, prices and history, and the file must be plain JSON"
test_c_rejects_non_json_extension: "Inventory.load must raise ValueError for a path that does not end in .json"
test_c_rejects_invalid_content: "Inventory.load must raise ValueError for malformed JSON, an invalid SKU, a negative quantity or a negative price in the file"
test_c_rejects_large_files: "Inventory.load must raise ValueError for files larger than 1 MB"
test_d_low_stock: "low_stock(threshold) must return the SKUs whose quantity is strictly below the threshold, sorted"
test_d_total_value_rounding: "total_value must return a Decimal rounded half up to two decimals, and Decimal('0.00') for an empty inventory"
