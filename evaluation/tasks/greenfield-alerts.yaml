taskId: task_eval_greenfield_alerts
title: Implementar el cliente de alertas
intent: >-
  Implementa el paquete de Python `alerts` en src/alerts/ exactamente como se especifica en SPEC.md,
  incluida la función build_alert_request y sus pruebas en tests/.
requirements:
  - requirementId: req_spec
    text: build_alert_request implementa todas las reglas de SPEC.md (validación, solicitud, autenticación).
    source: SPEC.md
  - requirementId: req_tests
    text: El repositorio contiene pruebas de pytest en tests/ que ejercitan las reglas de SPEC.md.
    source: SPEC.md
acceptanceCriteria:
  - criterionId: ac_rules
    text: Todas las reglas de SPEC.md se cumplen para build_alert_request.
  - criterionId: ac_no_network
    text: build_alert_request no hace ninguna llamada de red.
  - criterionId: ac_tests
    text: python -m pytest -q pasa.
constraints:
  - Usa solo la biblioteca estándar de Python.
  - Conserva la firma pública build_alert_request(event, *, base_url="https://alerts.internal.example").
