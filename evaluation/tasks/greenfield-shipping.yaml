taskId: task_eval_greenfield_shipping
title: Implementar la biblioteca de costos de envío
intent: >-
  Implementa el paquete de Python `shipping` en src/shipping/ exactamente como se especifica en SPEC.md,
  incluida la función shipping_cost y sus pruebas en tests/.
requirements:
  - requirementId: req_spec
    text: shipping_cost implementa todas las reglas de SPEC.md (validación, costo base, express, envío gratis, cupones, redondeo).
    source: SPEC.md
  - requirementId: req_tests
    text: El repositorio contiene pruebas de pytest en tests/ que ejercitan las reglas de SPEC.md.
    source: SPEC.md
acceptanceCriteria:
  - criterionId: ac_rules
    text: Todas las reglas y todos los límites de SPEC.md se cumplen para shipping_cost.
  - criterionId: ac_decimal
    text: shipping_cost devuelve un Decimal con exactamente dos decimales, redondeado una sola vez al final, con los empates hacia arriba (half up).
  - criterionId: ac_tests
    text: python -m pytest -q pasa.
constraints:
  - Usa solo la biblioteca estándar de Python.
  - Conserva la firma pública shipping_cost(weight_kg, zone, subtotal, *, express=False, coupon=None).
