taskId: task_eval_brownfield_strict_base64
title: Hacer estricto base64_decode
intent: >-
  itsdangerous.encoding.base64_decode descarta en silencio los caracteres que no pertenecen al
  alfabeto base64 seguro para URL (incluidos los caracteres no ASCII), así que varias cadenas distintas
  se decodifican a los mismos bytes y una firma puede alterarse sin que se rechace. Haz estricto el
  decodificador.
requirements:
  - requirementId: req_alphabet
    text: base64_decode lanza BadData cuando la entrada contiene cualquier carácter fuera de A-Z, a-z, 0-9, '-' y '_', salvo el relleno '=' al final.
    source: brownfield-evaluation
  - requirementId: req_padding
    text: Se siguen aceptando la entrada sin relleno y como máximo dos caracteres de relleno '=' al final.
    source: brownfield-evaluation
acceptanceCriteria:
  - criterionId: ac_reject
    text: Una entrada con '+', '/', espacios en blanco, caracteres no ASCII, caracteres de control o '=' antes del final lanza BadData, tanto para str como para bytes.
  - criterionId: ac_signatures
    text: Se rechaza un valor firmado o un token serializado cuya firma tiene insertado un carácter fuera del alfabeto.
  - criterionId: ac_existing
    text: Las pruebas existentes siguen pasando (python -m pytest -q) y el nuevo comportamiento queda cubierto por pruebas.
constraints:
  - Conserva la firma pública de base64_decode y base64_encode.
  - No agregues dependencias.
