# Ride-hailing and food delivery scenario (package `rides`, see fixture/INTERFACE.md and SPEC.md).
# Four instruction levels. one_line and paragraph see only INTERFACE.md in the repository;
# requirements and super also find SPEC.md in the repository as docs/SPEC.md.
# steps: the plan of the super prompt; with the harness each one is a short governed task.

one_line: build an app like Uber with Uber Eats, rides and food delivery, following INTERFACE.md

paragraph: >-
  Build the backend of a platform like Uber and Uber Eats in Python, following INTERFACE.md. Riders,
  drivers, couriers, restaurants and admins have accounts with secure passwords. Drivers register vehicles
  and go online; riders get a price quote with surge pricing, request a ride, a nearby driver is matched,
  and the ride goes from pickup to drop-off with cancellations, tips and scheduled rides. Restaurants have
  opening hours and menus with options; riders order food, the restaurant accepts and prepares it and a
  courier delivers it, with batching of orders. Add promo codes and referrals, cards and a wallet,
  earnings and weekly payouts for drivers and couriers, ratings, support tickets, trip sharing,
  notifications, admin reports and an audit log. Store everything in SQLite. Use a virtual clock. Keep
  the code clean and add tests.

requirements_intro: >-
  Build the backend of the ride-hailing and food delivery platform described in docs/SPEC.md, following
  INTERFACE.md. Implement every requirement of docs/SPEC.md exactly as written (numbers, rounding,
  exceptions, identifiers) and write pytest tests under tests/ for every requirement; python -m pytest -q
  must pass. Use only the Python standard library.

approval_conditions:
- Every requirement of the step has at least one pytest test that would fail if the requirement were broken.
- python -m pytest -q passes, including the tests of every earlier step.
- The change touches only src/rides and tests, adds no dependency and keeps INTERFACE.md intact.
- Money is never a float, every rounding is half up where the specification says so, and no plain password,
  card number or cvc is stored.
- The code of the step follows the engineering guide (layers, state machines, Decimal, clock, validation
  helper, size limits), and every limit of its requirements is tested on both sides.

engineering_guide:
- "Architecture: a thin Platform facade in src/rides/platform.py that checks the actor and delegates; a domain
  layer (entities, value objects, state machines) with no I/O; one service module per area (accounts, fleet,
  geography, pricing, dispatch, rides, scheduling, restaurants, orders, couriers, promotions, payments,
  earnings, ratings, support, notifications, reports, audit); one persistence module, the only one that
  imports sqlite3. Dependencies point inward: facade, then services, then domain."
- "Size: no module over 400 lines, no function over 40 lines or with cyclomatic complexity over 10, no class
  with more than one responsibility, no duplicated logic."
- "Ride and order statuses are explicit state machines: one table of allowed transitions per entity, and every
  status change goes through it."
- "Money is Decimal end to end and is rounded half up in one helper; never float. Time comes only from the
  virtual clock; every timer (offers, order expiry, scheduled dispatch) sits in one ordered queue that
  advance() runs in time order."
- "Validation and error precedence (rule X8) live in one helper module used by every service, not rewritten
  in each method."
- "Dispatch uses a spatial index (a grid of cells) so that a request among 5,000 online drivers stays far
  below the limit of V3."
- "Persistence: a versioned schema (schema_version table), one transaction per save(), passwords stored only
  as salted PBKDF2 hashes, card numbers and cvc never stored."
- "Type hints on every function, written to pass mypy --strict and ruff with no findings; docstrings on public
  classes and functions; no dead code and no broad except."
- "Tests: tests/ mirrors the services; each requirement has tests named after its id (test_<id>_...) that use
  the public Platform API only, cover both sides of every time, distance and amount limit and every exception
  type, are independent of each other and run in under a minute."

