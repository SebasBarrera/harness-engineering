# SonarQube Cloud (formerly SonarCloud) analysis settings.
# The organization and project key must match the project imported in SonarQube Cloud
# (see docs/maintainer-setup.md).
sonar.organization=sebasbarrera
sonar.projectKey=SebasBarrera_harness-engineering
sonar.projectName=Governed Agent Harness

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12, 3.13, 3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/ci/junit-all.xml
sonar.sourceEncoding=UTF-8

# JSON Schemas under resources/ are generated contracts (scripts/generate_schemas.py), and the
# test fixtures are sample projects driven by the tests, not code under test.
sonar.exclusions=src/governed_harness/resources/schemas/**
sonar.test.exclusions=tests/fixtures/**
sonar.coverage.exclusions=src/governed_harness/resources/**
