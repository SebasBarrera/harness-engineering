# Dependabot version updates, targeting develop. Minor and patch updates are grouped per
# ecosystem to keep the number of pull requests small.
version: 2
updates:
  - package-ecosystem: pip
    # pyproject.toml and docs/requirements.txt. The hash-pinned files under requirements/ are left
    # out: Dependabot cannot regenerate the universal uv locks (it drops the pyproject.toml part),
    # so they are refreshed with `python scripts/lock_requirements.py --upgrade`. Security alerts
    # still cover them through the dependency graph.
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, type:chore]
    commit-message:
      prefix: build
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, type:ci]
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area:docker]
    commit-message:
      prefix: build
      include: scope
