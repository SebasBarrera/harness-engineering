# Fuzzing with Atheris (tests/fuzz): the validator output parsers, the SARIF reader and the
# secret redactor, each checking a property. A crash or a broken property fails the job; the
# corpus is not kept between runs. Linux only (Atheris ships Linux wheels).
name: fuzz

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    paths:
      - "src/governed_harness/validators/parsers.py"
      - "src/governed_harness/checks/sarif.py"
      - "src/governed_harness/evidence/redaction.py"
      - "tests/fuzz/**"
      - "requirements/fuzz.txt"
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }} (report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [parsers, sarif, redaction]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Atheris and the package (hash-pinned)
        run: |
          python -m pip install --require-hashes -r requirements/fuzz.txt
          python -m pip install --no-deps -e .
      - name: Fuzz for five minutes
        env:
          TARGET: ${{ matrix.target }}
        run: python "tests/fuzz/fuzz_${TARGET}.py" -max_total_time=300 -timeout=10
