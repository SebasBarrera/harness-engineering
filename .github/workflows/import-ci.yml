# Import-phase CI for the byte-faithful import of the v0.8.0 cut (issue #21).
# Tests, packaging, provenance, privacy and secret scanning are blocking.
# Ruff and Mypy run as a non-required report until v0.8.1 fixes their findings.
# The original .github/workflows/ci.yml of the cut is imported unchanged and disabled (issue #15).
name: import-ci

# Single-maintainer flow: work branches are merged into develop without pull requests, so CI
# runs on every push to a work branch (must be green before the merge) and again on develop/main.
on:
  push:
    branches:
      - develop
      - main
      - "release/**"
      - "hotfix/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "ci/**"
      - "chore/**"
      - "test/**"
      - "build/**"
      - "security/**"
      - "refactor/**"
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_COLOR: "0"

jobs:
  tests:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Install package with dev and api extras
        run: python -m pip install -e ".[dev,api]"
      - name: Use a symlink-free temporary directory on macOS (known defect, issue #19)
        if: runner.os == 'macOS'
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
      - name: Run test families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          ran=0
          for family in unit contract integration security e2e performance; do
            if compgen -G "tests/${family}/test_*.py" > /dev/null; then
              echo "::group::pytest tests/${family}"
              python -m pytest "tests/${family}" -W error::ResourceWarning \
                --junitxml="reports/ci/junit-${family}.xml" \
                --cov=governed_harness --cov-branch --cov-append --cov-report=
              echo "::endgroup::"
              echo "| ${family} | passed |" >> "$RUNNER_TEMP/families.md"
              ran=$((ran + 1))
            fi
          done
          {
            echo "### Tests (Python ${{ matrix.python }}, ${{ matrix.os }})"
            if [ "$ran" -eq 0 ]; then
              echo "No test family has been imported yet; only installation was verified."
            else
              echo "| family | result |"; echo "|---|---|"; cat "$RUNNER_TEMP/families.md"
              python -m coverage report --format=markdown | tail -n 3
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ran" -gt 0 ]; then
            python -m coverage xml -o reports/ci/coverage.xml
            python -m coverage html -d reports/ci/htmlcov
          fi
      - name: Verify generated schemas are up to date
        if: hashFiles('scripts/generate_schemas.py') != ''
        run: |
          python scripts/generate_schemas.py
          git diff --exit-code -- schemas src/governed_harness/resources/schemas
      - name: Upload test reports
        if: matrix.os == 'ubuntu' && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: reports/ci/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/python -c "import governed_harness; print(governed_harness.__version__)"
          if /tmp/clean/bin/python -c "import governed_harness.cli.main" 2>/dev/null; then
            /tmp/clean/bin/harness --help
            echo "Wheel installs and \`harness --help\` responds." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Wheel installs and imports; the CLI has not been imported yet." >> "$GITHUB_STEP_SUMMARY"
          fi

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify imported files against the v0.8.0 manifest
        run: |
          python3 scripts/verify_provenance.py partial | tee "$RUNNER_TEMP/provenance.txt"
          { echo '### Provenance (partial)'; echo '```'; head -n 2 "$RUNNER_TEMP/provenance.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked files against the privacy denylist
        run: python3 scripts/check_denylist.py

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version and checksum)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan the full Git history
        run: /tmp/gitleaks git --redact --no-banner -v .

  lint-report:
    name: lint report (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev,api]"
      - name: Ruff and Mypy (report; required from v0.8.1)
        shell: bash
        run: |
          # The linters' exit codes are captured explicitly below, so errexit is disabled here.
          set +e -uo pipefail
          targets=""
          for d in src tests; do if [ -d "$d" ]; then targets="$targets $d"; fi; done
          python -m ruff check $targets --output-format=concise > "$RUNNER_TEMP/ruff.txt"; ruff_rc=$?
          python -m mypy --strict src > "$RUNNER_TEMP/mypy.txt"; mypy_rc=$?
          {
            echo "### Lint report (not required during import)"
            echo "- ruff \`$(ruff --version)\`: exit ${ruff_rc}, $(tail -n 1 "$RUNNER_TEMP/ruff.txt")"
            echo "- mypy \`$(mypy --version)\`: exit ${mypy_rc}, $(tail -n 1 "$RUNNER_TEMP/mypy.txt")"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/ruff.txt" "$RUNNER_TEMP/mypy.txt"
          exit $(( ruff_rc | mypy_rc ))
