name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,api]'
      - run: python scripts/generate_schemas.py
      - run: git diff --exit-code -- schemas src/governed_harness/resources/schemas
      - run: pytest -W error::ResourceWarning --junitxml=reports/junit.xml
      - run: python -m compileall -q src tests
      - run: python setup.py sdist bdist_wheel
