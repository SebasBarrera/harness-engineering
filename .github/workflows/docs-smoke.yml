# Keeps the documentation honest: reproduces the README quickstart and the demonstration flows
# with their documented exit codes, runs the brownfield example on the built wheel (it downloads
# the itsdangerous tag archive, checked by SHA-256, and hash-pinned packages), checks that the
# generated references are up to date and builds the documentation site in strict mode.
name: docs-smoke

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
      - "hotfix/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "ci/**"
      - "chore/**"
      - "test/**"
      - "build/**"
      - "security/**"
      - "refactor/**"
      - "style/**"
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  flows:
    name: quickstart and exit codes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install the package with pytest (as a user would)
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build"/bin/python -m pip install --require-hashes -r requirements/tools-build.txt
          "$RUNNER_TEMP/build"/bin/python -m build --wheel --no-isolation --outdir dist
          python -m pip install --require-hashes -r requirements/bench.txt
          python -m pip install --no-deps dist/*.whl
      - name: Run the quickstart and the demonstration flows
        run: |
          python scripts/demo_flows.py all --transcript transcript.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          steps = json.load(open("transcript.json"))
          print("### Documented flows\n\n| Flow | Command | Expected | Actual |\n|---|---|---:|---:|")
          for s in steps:
              print(f"| {s['flow']} | `{s['command'][:80]}` | {s['expected']} | {s['actual']} |")
          PY
      - name: Reproduce the brownfield case (pallets/itsdangerous 2.2.0)
        run: |
          wheel=$(ls "$PWD"/dist/*.whl)
          PYTHON=python bash examples/brownfield-itsdangerous/reproduce.sh "$wheel" "$RUNNER_TEMP/brownfield"

  references:
    name: generated references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the CLI and task-file references are up to date
        run: |
          python -m pip install --require-hashes -r requirements/runtime.txt
          python -m pip install --no-deps -e .
          python scripts/gen_cli_docs.py --check
          python scripts/gen_schema_docs.py --check

  site:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the site in strict mode
        run: |
          python -m pip install --require-hashes -r requirements/docs.txt
          python -m mkdocs build --strict --site-dir site
