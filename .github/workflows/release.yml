# Release pipeline for tags v* (from v0.8.1; v0.8.0 is the thesis cut released with its original
# artifacts). Builds sdist and wheel, generates an SPDX SBOM, attests build provenance, writes
# SHA256SUMS and creates the GitHub release with notes generated from Conventional Commits.
# PyPI: the publish-pypi job uploads the same distributions through a Trusted Publisher (OIDC, no
# token) and runs only when the repository variable PYPI_PUBLISH is 'true'; without it the release
# is created as before (docs/maintainer-setup.md).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: build, attest and publish
    if: github.ref_name != 'v0.8.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${TAG}" || { echo "::error::tag ${TAG} does not match version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Generate the SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: governed-agent-harness.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance of the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Keep the attested distributions for the PyPI job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp governed-agent-harness.spdx.json dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          previous=$(git describe --tags --abbrev=0 "${TAG}^")
          python scripts/release_notes.py "${previous}" "${TAG}" > notes.md
          {
            echo
            echo "## Verification"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify governed_agent_harness-${TAG#v}-py3-none-any.whl --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --verify-tag --title "${TAG}" --notes-file notes.md

  publish-pypi:
    name: publish to PyPI (Trusted Publisher)
    # Only after the build job, only on a tag, and only when the maintainer enabled it by setting
    # the repository variable PYPI_PUBLISH to 'true' (after configuring the Trusted Publisher on
    # pypi.org). Without the variable the job is skipped and the release does not depend on it.
    if: vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/governed-agent-harness/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions built and attested by the release job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
