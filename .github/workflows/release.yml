# Release pipeline for tags v* (from v0.8.1; v0.8.0 is the thesis cut released with its original
# artifacts). Builds sdist and wheel, generates an SPDX SBOM, attests build provenance, writes
# SHA256SUMS and creates the GitHub release with notes generated from Conventional Commits.
# Publication to PyPI is disabled (PUBLISH_TO_PYPI: false in the publication plan).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: build, attest and publish
    if: github.ref_name != 'v0.8.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${TAG}" || { echo "::error::tag ${TAG} does not match version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Generate the SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: governed-agent-harness.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance of the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp governed-agent-harness.spdx.json dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          previous=$(git describe --tags --abbrev=0 "${TAG}^")
          python scripts/release_notes.py "${previous}" "${TAG}" > notes.md
          {
            echo
            echo "## Verification"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify governed_agent_harness-${TAG#v}-py3-none-any.whl --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --verify-tag --title "${TAG}" --notes-file notes.md
