# Documentation site: MkDocs Material plus the HTML reports (coverage, benchmarks with their
# trend, process metrics of the demonstration flows). Built on develop and main; deployed to
# GitHub Pages from main (releases) or on demand.
name: pages

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install the package and the documentation toolchain
        run: |
          python -m pip install -e ".[dev,api]"
          python -m pip install -r docs/requirements.txt
      - name: Build the documentation (strict)
        run: python -m mkdocs build --strict --site-dir site
      - name: Coverage report
        run: |
          python -m pytest -W error::ResourceWarning --cov=governed_harness --cov-branch \
            --cov-report=html:site/coverage --cov-report=term
      - name: Benchmark report (5 repetitions)
        run: |
          mkdir -p bench site/benchmarks/report
          for i in 1 2 3 4 5; do
            harness benchmark run --iterations 1000 --output "bench/micro-${i}.json"
          done
          harness benchmark scenarios --iterations 3 --output bench/scenarios.json
          python scripts/benchmark_report.py --micro bench/micro-*.json \
            --scenarios bench/scenarios.json \
            --reference docs/benchmarks/thesis-reference.json \
            --output site/benchmarks/report/index.html
      - name: Process-metrics report of the demonstration flows
        run: |
          mkdir -p site/metrics-report
          # The run registry (runtime.stateDir: auto) both scripts read.
          export HARNESS_STATE_DIR="$RUNNER_TEMP/demo-state"
          python scripts/demo_flows.py all --workdir "$RUNNER_TEMP/demo" --transcript site/metrics-report/transcript.json
          python scripts/metrics_report.py "$RUNNER_TEMP"/demo/* --output site/metrics-report/index.html \
            --json site/metrics-report/summary.json
      - name: Fetch the benchmark trend from gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages-data
          persist-credentials: false
      - name: Add the trend pages
        shell: bash
        run: |
          if [ -d gh-pages-data/bench/trend ]; then
            mkdir -p site/benchmarks/trend
            cp -R gh-pages-data/bench/trend/. site/benchmarks/trend/
            echo "Benchmark trend included." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No benchmark trend on gh-pages yet; the benchmarks workflow creates it."
            echo "Benchmark trend not available yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
