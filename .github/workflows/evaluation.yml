# Deterministic suites of the 2.0.0 evaluation on Linux (no model is called): fault probes,
# verification-ladder and review-panel corpora, friction, INTENT equivalence, block 0 and metrics
# validity in one job; the pre-registered suites (H01-H07, H09, H10, H12-H20, H22-H24, H27, H28,
# H31, H32, H35, H36, H38, H40, H41, H44, H45) one job each (together they exceed the 6 h limit of
# a job); then the H11 defect-escape corpus, which reads the results of the others. H46 (portability) runs fault probes, friction, ladder, review and the
# documented flows from one wheel on Linux with and without bubblewrap, macOS and Windows, then
# compares the results with the pre-registered expected differences. Run by hand on the branch or tag to evaluate ("Use workflow from"):
# its own code is the harness under test (its wheel, and the checkout block 0 verifies) and its
# evaluation code runs the suites. The results are artifacts that a person reviews and commits
# under evaluation/results-2.0.0. Informational: it never gates a merge.
name: evaluation

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated suites (default: all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: select the suites (report)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      earlier: ${{ steps.select.outputs.earlier }}
      interception: ${{ steps.select.outputs.interception }}
      corpus: ${{ steps.select.outputs.corpus }}
      portability: ${{ steps.select.outputs.portability }}
    steps:
      - name: Split the requested suites between the jobs
        id: select
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -f # the names are words, never file patterns
          earlier="fault-probes ladder review friction intent-equivalence block0 metrics-validity"
          # One job per pre-registered suite, each within the 6 h limit of a job.
          interception="h01 h02 h03 h04 h05 h06 h07 h09 h10 h12 h13 h14 h15 h16 h17 h18 h19 h20"
          interception="$interception h22 h23 h24 h27 h28 h31 h32 h35 h36 h38 h40 h41 h44 h45 h47 h48 h50 h51"
          wanted="${ONLY:-$earlier $interception defect-corpus portability}"
          picked_earlier=""
          picked_interception=""
          corpus=false
          portability=false
          for name in ${wanted//,/ }; do
            case " $earlier " in
              *" $name "*) picked_earlier="$picked_earlier${picked_earlier:+,}$name"; continue ;;
            esac
            case " $interception " in
              *" $name "*) picked_interception="$picked_interception${picked_interception:+,}\"$name\""; continue ;;
            esac
            if [ "$name" = defect-corpus ]; then
              corpus=true
              continue
            fi
            if [ "$name" = portability ]; then
              portability=true
              continue
            fi
            echo "::error::unknown suite: $name"
            exit 1
          done
          {
            echo "earlier=$picked_earlier"
            echo "interception=[$picked_interception]"
            echo "corpus=$corpus"
            echo "portability=$portability"
          } >> "$GITHUB_OUTPUT"

  deterministic:
    name: deterministic suites (report)
    needs: plan
    if: needs.plan.outputs.earlier != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install bubblewrap and GNU time (the agent sandbox and block 0's memory measurement)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap time
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true
      - name: Build the wheel of this ref
        run: |
          python -m pip install -q --require-hashes -r requirements/tools-build.txt
          python -m build --wheel --no-isolation --outdir dist
          sha256sum dist/*.whl
          git rev-parse HEAD | tee dist/commit.txt
      - name: Run the deterministic suites
        env:
          ONLY: ${{ needs.plan.outputs.earlier }}
        run: |
          git config --global user.name "evaluation"
          git config --global user.email "evaluation@localhost"
          wheel=$(ls dist/*.whl)
          python evaluation/campaign/run_deterministic.py --wheel "$wheel" \
            --work "$RUNNER_TEMP/campaign" --out results/deterministic --only "$ONLY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-deterministic
          path: |
            results/
            dist/
          if-no-files-found: error

  interception:
    name: ${{ matrix.suite }} suite (report)
    needs: plan
    if: needs.plan.outputs.interception != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.interception) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install bubblewrap (the agent sandbox)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true
      - name: Build the wheel of this ref
        run: |
          python -m pip install -q --require-hashes -r requirements/tools-build.txt
          python -m build --wheel --no-isolation --outdir dist
          sha256sum dist/*.whl
          git rev-parse HEAD | tee dist/commit.txt
      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          git config --global user.name "evaluation"
          git config --global user.email "evaluation@localhost"
          wheel=$(ls dist/*.whl)
          python evaluation/campaign/run_deterministic.py --wheel "$wheel" \
            --work "$RUNNER_TEMP/campaign" --out results/deterministic --only "$SUITE"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-deterministic-${{ matrix.suite }}
          path: |
            results/
            dist/
          if-no-files-found: error

  defect-corpus:
    name: defect-escape corpus H11 (report)
    needs: [plan, deterministic, interception]
    # It also runs when a suite failed or was not selected: the corpus then reports the absent
    # input as such and exits 1.
    if: always() && needs.plan.outputs.corpus == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the results of the suites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # One directory per artifact: artifacts/<artifact name>/results/deterministic/<suite>.
          pattern: evaluation-deterministic*
          path: artifacts
      - name: Aggregate the defect-escape corpus
        run: |
          earlier=artifacts/evaluation-deterministic/results/deterministic
          python evaluation/deterministic/defect_corpus.py --out results/deterministic/defect-corpus \
            --inputs \
              artifacts/evaluation-deterministic-h01/results/deterministic/h01 \
              artifacts/evaluation-deterministic-h02/results/deterministic/h02 \
              artifacts/evaluation-deterministic-h03/results/deterministic/h03 \
              artifacts/evaluation-deterministic-h04/results/deterministic/h04 \
              artifacts/evaluation-deterministic-h05/results/deterministic/h05 \
              artifacts/evaluation-deterministic-h06/results/deterministic/h06 \
              artifacts/evaluation-deterministic-h07/results/deterministic/h07 \
              artifacts/evaluation-deterministic-h09/results/deterministic/h09 \
              artifacts/evaluation-deterministic-h10/results/deterministic/h10 \
              "$earlier/ladder" \
              "$earlier/review"
      - name: Upload the corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-defect-corpus
          path: results/
          if-no-files-found: error

  portability-wheel:
    name: portability wheel H46 (report)
    needs: plan
    if: needs.plan.outputs.portability == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # One wheel for every platform: H46 compares the same artifact, and the hash-pinned build
      # tools (requirements/tools-build.txt) are only used on Linux elsewhere.
      - name: Build the wheel of this ref
        run: |
          python -m pip install -q --require-hashes -r requirements/tools-build.txt
          python -m build --wheel --no-isolation --outdir dist
          sha256sum dist/*.whl
          git rev-parse HEAD | tee dist/commit.txt
      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portability-wheel
          path: dist/
          if-no-files-found: error

  portability:
    name: portability ${{ matrix.platform }} (report)
    needs: [plan, portability-wheel]
    if: needs.plan.outputs.portability == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-bwrap
            os: ubuntu-24.04
          - platform: linux-nobwrap
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install bubblewrap (the agent sandbox)
        if: matrix.platform == 'linux-bwrap'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true
      - name: Make sure bubblewrap is absent (the condition of sandbox.unavailable)
        if: matrix.platform == 'linux-nobwrap'
        run: |
          if command -v bwrap; then sudo apt-get remove -y -q bubblewrap; fi
          if command -v bwrap; then
            echo "::error::bwrap is still on PATH"
            exit 1
          fi
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portability-wheel
          path: dist
      - name: Run fault probes, friction, ladder and review
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          git config --global user.name "evaluation"
          git config --global user.email "evaluation@localhost"
          wheel=$(ls dist/*.whl)
          # A short work directory keeps the Windows paths under 260 characters.
          python evaluation/campaign/run_deterministic.py --wheel "$wheel" \
            --work "$RUNNER_TEMP/c" --out "results/portability/$PLATFORM" \
            --only fault-probes,ladder,review,friction
      - name: Run the documented flows
        if: ${{ !cancelled() }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The environment run_deterministic.py made: the wheel and the validators' tools.
          if [ "$RUNNER_OS" = Windows ]; then
            bin="$(cygpath -u "$RUNNER_TEMP")/c/venv/Scripts"
          else
            bin="$RUNNER_TEMP/c/venv/bin"
          fi
          out="results/portability/$PLATFORM/demo"
          mkdir -p "$out"
          PATH="$bin:$PATH" python scripts/demo_flows.py all --workdir "$RUNNER_TEMP/demo" \
            --transcript "$out/demo-transcript.json" 2>&1 | tee "$out/demo-output.txt"
          PATH="$bin:$PATH" python evaluation/deterministic/sanitize_paths.py "$out" \
            --work "$RUNNER_TEMP/demo"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portability-${{ matrix.platform }}
          path: |
            results/
            dist/
          if-no-files-found: error

  portability-compare:
    name: portability comparison H46 (report)
    needs: [plan, portability]
    # It also runs when a platform failed: that platform's suites are then "not evaluated" and
    # the comparison exits 1.
    if: always() && needs.plan.outputs.portability == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the results of the platforms
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # One directory per artifact: artifacts/portability-<platform>/results/portability/<platform>.
          pattern: portability-*
          path: artifacts
      - name: Compare with the expected differences
        run: |
          args=()
          for platform in linux-bwrap linux-nobwrap macos windows; do
            args+=(--platform "$platform=artifacts/portability-$platform/results/portability/$platform")
          done
          python evaluation/deterministic/portability_compare.py \
            --out results/portability/compare "${args[@]}"
      - name: Add the table to the job summary
        if: always()
        run: |
          if [ -f results/portability/compare/portability.md ]; then
            cat results/portability/compare/portability.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-portability
          path: results/
          if-no-files-found: error
