# Windows run: the test suite and the documented flows. On timeout or cancellation Windows
# terminates the launched process but not its descendants (process groups are POSIX-only).
# Kept separate from ci.yml because it is slower and runs on develop, main and release branches.
name: windows

on:
  push:
    branches: [develop, main, "release/**"]
  schedule:
    - cron: "37 6 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py3.12, windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install package with dev and api extras
        run: python -m pip install -e ".[dev,api]"
      - name: Run the test suite
        run: python -m pytest -W error::ResourceWarning
      - name: Run the demonstration flows
        run: python scripts/demo_flows.py all --workdir "${{ runner.temp }}/demo"
