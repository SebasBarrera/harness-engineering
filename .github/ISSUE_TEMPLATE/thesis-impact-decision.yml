name: Thesis-impact decision
description: A behavior change that touches what v0.8.0 (an earlier, obsolete iteration of the thesis) did; optional, since such defects may be fixed directly.
title: "decision: "
labels: ["thesis-impact", "needs-decision"]
body:
  - type: markdown
    attributes:
      value: |
        v0.8.0 is an earlier, obsolete iteration of the thesis (its tag stays immutable and
        reproducible); its behavior may change in new versions and `thesis-impact` defects can
        be fixed. Use this form only when a change needs an explicit decision; the label and the
        milestone "backlog — thesis-impact" remain for tracking.
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior on v0.8.0
      description: Location in the code and a reproduction.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Keep and document, change, or change behind a configuration flag; pros and cons of each.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Effect on the 2.0.1 evaluation
      description: Which measurements of the 2.0.1 campaign, if any, would change?
    validations:
      required: true
